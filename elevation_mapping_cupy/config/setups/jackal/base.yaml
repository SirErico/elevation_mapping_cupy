# Jackal J100 elevation mapping config.
# Overrides map_frame to 'map' (core_param.yaml defaults to 'base_link')
# so the GridMap is expressed in the fixed map frame, compatible with Nav2.
/elevation_mapping_node:
  ros__parameters:
    map_frame: 'map'
    base_frame: 'base_link'
    corrected_map_frame: 'map'

    subscribers:
      lidar3d:
        topic_name: '/j100_0000/sensors/lidar3d_0/points'
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: ['elevation', 'traversability', 'variance']
        basic_layers: ['elevation']
        fps: 5.0
      elevation_map_filter:
        layers: ['min_filter', 'smooth', 'inpaint', 'elevation', 'slope']
        basic_layers: ['min_filter']
        fps: 3.0
